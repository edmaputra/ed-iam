name: CI

on:
  push:
    branches:
      - main
      - 'test/**'
      - 'feat/**'
      - 'release/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java-version }} - ${{ matrix.distribution }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: ['25']
        distribution: ['temurin']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java-version }} (${{ matrix.distribution }})
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and verify with Maven
        run: ./mvnw clean verify -B

      - name: Upload JaCoCo Coverage Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report-${{ matrix.distribution }}
          path: '**/target/site/jacoco*/**'
          if-no-files-found: ignore

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-failsafe-reports-${{ matrix.distribution }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
